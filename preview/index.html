<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<style>
body{margin:0;font-family:-apple-system,"Segoe UI",Inter,sans-serif;font-size:15px}
body.theme-dark{--background-primary:#1e1e1e;--background-secondary:#262626;--background-modifier-border:#363636;--background-modifier-hover:rgba(255,255,255,.08);--text-normal:#dadada;--text-muted:#999;--text-faint:#666;--interactive-accent:#7f6df2;--text-on-accent:#fff;background:#1e1e1e;color:#dadada}
body.theme-light{--background-primary:#fff;--background-secondary:#f6f6f6;--background-modifier-border:#ddd;--text-normal:#222;--text-muted:#666;--interactive-accent:#7f6df2;--text-on-accent:#fff;background:#fff;color:#222}
button{font:inherit;color:inherit;background:var(--background-secondary);border:1px solid var(--background-modifier-border);border-radius:6px;padding:4px 10px}
input,textarea,select{font:inherit;color:inherit;background:var(--background-primary);border:1px solid var(--background-modifier-border);border-radius:6px;padding:4px 8px}
/* emulate a glossy community theme */ button{background-image:linear-gradient(#d6d6dc,#9a9aa3);box-shadow:0 2px 4px rgba(0,0,0,.6);}
</style><link rel="stylesheet" href="../styles.css"></head><body><script src="bundle.js"></script></body></html>
